plugins { id 'fabric-loom' version '1.9.2' }
version = '2.0'
group = 'pl.gabrys.autorynek'
base { archivesName = 'auto-rynek-skibidi-gabrys' }

// Fabric i Mojang NIE sa na mavenCentral. Bez tych repozytoriow Gradle nie
// potrafi pobrac zaleznosci i zatrzymuje sie na etapie przygotowania projektu.
repositories {
    mavenCentral()
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    maven { name = 'Mojang'; url = 'https://libraries.minecraft.net/' }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings "net.fabricmc:yarn:1.21.4+build.8:v2"
    modImplementation 'net.fabricmc:fabric-loader:0.16.9'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.119.0+1.21.4'
}

java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
