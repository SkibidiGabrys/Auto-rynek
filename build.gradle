plugins { id 'fabric-loom' version '1.9.2'; id 'maven-publish' }
version = '0.1.0'
group = 'pl.gabrys.autorynek'
base { archivesName = 'auto-rynek-skibidi-gabrys' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.4'
 mappings 'net.fabricmc:yarn:1.21.4+build.8:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.16.9'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.119.0+1.21.4'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
